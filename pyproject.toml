version = "0.1.0"
description = "Local PDF RAG chatbot using Ollama, LangChain, and ChromaDB"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "langchain",
    "langchain-community",
    "chromadb",
    "sentence-transformers",
    "pypdf",
    "streamlit",
    "ollama"
]